version: "3.8"

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe

    ports:
      - "1521:1521"

    environment:
      ORACLE_PASSWORD: 123456
      APP_USER: magicapi
      APP_USER_PASSWORD: magicapi123

    volumes:
      - oracle-data:/opt/oracle/oradata

    restart: unless-stopped

volumes:
  oracle-data: