spring:
  application:
    name: magicapi

  datasource:
    url: jdbc:h2:mem:magicapi;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true


server:
  port: 8080